[project]
name = "tripwire-ml"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightgbm>=4.7.0",
    "polars>=2.0.0",
    "scikit-learn>=1.9.1",
    "tripwire-common",
    "tripwire-ingest",
]

[tool.uv.sources]
tripwire-common = { workspace = true }
tripwire-ingest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire_ml"]
