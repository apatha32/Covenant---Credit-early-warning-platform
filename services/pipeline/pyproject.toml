[project]
name = "tripwire-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandera[polars]>=0.34.1",
    "polars>=2.0.0",
    "rapidfuzz>=3.14.6",
    "tripwire-common",
]

[tool.uv.sources]
tripwire-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire_pipeline"]
