[project]
name = "tripwire-llm"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.4.0",
    "polars>=2.0.0",
    "tripwire-common",
    "tripwire-ingest",
    "tripwire-ml",
]

[tool.uv.sources]
tripwire-common = { workspace = true }
tripwire-ml = { workspace = true }
tripwire-ingest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire_llm"]
