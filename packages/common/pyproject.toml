[project]
name = "tripwire-common"
version = "0.1.0"
description = "Shared config, logging and database helpers for tripwire services."
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=2.0.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire_common"]
